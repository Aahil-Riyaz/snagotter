# ytdown on a public server, behind an existing Caddy (see deploy/install.sh).
# Run from the repo root:  docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
services:
  ytdown:
    build:
      context: ..
      args:
        VITE_ENGINE_URL: ""          # the app is served by the engine itself: same origin
        VITE_REPO_URL: ${YTDOWN_REPO_URL:-https://github.com/Aahil-Riyaz/snagotter}
    image: ytdown:server
    container_name: ytdown
    restart: unless-stopped
    environment:
      YTDOWN_MODE: hosted
      YTDOWN_AUTOUPDATE: nightly
      YTDOWN_ORIGINS: https://${YTDOWN_DOMAIN},${YTDOWN_APP_ORIGINS:-https://snagotter.vercel.app,https://ytdown-beta.vercel.app}
      YTDOWN_TRUSTED_PROXIES: "*"   # only reachable through Caddy on the Docker network
      YTDOWN_CONCURRENCY: "2"
      YTDOWN_TTL: "1200"                     # files nobody picks up are deleted after 20 minutes
      YTDOWN_KEEP_AFTER_DOWNLOAD_S: "90"     # downloaded files are deleted 90 seconds later
      YTDOWN_MAX_TEMP_GB: "20"
      YTDOWN_MAX_FILESIZE_MB: "2048"
      YTDOWN_RATE_PER_MINUTE: "20"
      # YouTube refuses cloud addresses, so it goes through Cloudflare WARP (free). TikTok is banned in
      # India, where this server is, so it leaves through Tor exits in other countries (free).
      # Override in deploy/.env; an empty YTDOWN_PROXY_MAP= sends everything direct.
      YTDOWN_PROXY_MAP: ${YTDOWN_PROXY_MAP-youtube=socks5://ytdown-warp:1080,tiktok=socks5://ytdown-tor:9050}
      YTDOWN_PROXY: ${YTDOWN_PROXY:-}
      YTDOWN_PROXY_SITES: ${YTDOWN_PROXY_SITES:-youtube}
      # Optional: deploy/secrets/cookies.txt from a spare account, used only for these sites.
      YTDOWN_COOKIES_FILE: /run/ytdown-secrets/cookies.txt
      YTDOWN_COOKIE_SITES: ${YTDOWN_COOKIE_SITES:-instagram}
    volumes:
      - ytdown_tmp:/tmp/ytdown      # on disk, not RAM, so other services keep their memory
      - ./secrets:/run/ytdown-secrets:ro
    mem_limit: 1536m
    depends_on: [warp, tor]
    networks: [proxy]

  warp:
    # Cloudflare WARP in proxy mode, from Cloudflare's official package. NET_ADMIN lets it set
    # routing rules inside its own container only; it doesn't touch the host's network.
    build: ./warp
    image: ytdown-warp:latest
    container_name: ytdown-warp
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    volumes:
      - warp_data:/var/lib/cloudflare-warp   # keeps the free WARP registration across restarts
    mem_limit: 256m
    networks: [proxy]

  tor:
    # Tor client from Debian's package, SOCKS only on the Docker network (no relay, no exit).
    build: ./tor
    image: ytdown-tor:latest
    container_name: ytdown-tor
    restart: unless-stopped
    volumes:
      - tor_data:/var/lib/tor
    mem_limit: 256m
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${YTDOWN_PROXY_NETWORK:-n8n_default}
volumes:
  ytdown_tmp:
  warp_data:
  tor_data:
