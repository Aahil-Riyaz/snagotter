<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SnagOtter: Free Video Downloader for YouTube, Instagram, TikTok, Facebook and X</title>
  <meta name="description" content="Download videos and audio from YouTube, Instagram Reels, TikTok, Facebook and X. Paste a link, pick the quality, save it. Free, no sign-up, no ads, works on iPhone and Android.">
  <link rel="canonical" href="https://snagotter.vercel.app/">
  <meta name="msvalidate.01" content="F26D6756DC3A3A5E054E4AFE0E6D80EA">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SnagOtter">
  <meta property="og:title" content="SnagOtter: Free Video Downloader">
  <meta property="og:description" content="Save videos and audio from YouTube, Instagram, TikTok, Facebook and X. Free, no sign-up, no ads.">
  <meta property="og:url" content="https://snagotter.vercel.app/">
  <meta property="og:image" content="https://snagotter.vercel.app/icon-512.png">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebApplication","name":"SnagOtter","url":"https://snagotter.vercel.app/",
   "applicationCategory":"MultimediaApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},
   "description":"Free video and audio downloader for YouTube, Instagram, TikTok, Facebook and X.",
   "author":{"@type":"Person","name":"Aahil Riyaz Beekay"}}
  </script>
  <meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SnagOtter">
  <link rel="preload" as="image" href="/brand/otter-3d.webp" type="image/webp" fetchpriority="high">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // set theme before paint: no flash
    try { var t = localStorage.getItem("ytdown.theme"); if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    /* desktop refresh intro: covers the swap from pre-rendered HTML to the app */
    #boot{display:none}
    @media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:14px;background:#F4F5F8;
        pointer-events:none;animation:boot-out .32s cubic-bezier(.4,0,.2,1) .62s forwards}
      [data-theme="dark"] #boot{background:#0E1014}
      #boot img{width:84px;height:84px;animation:boot-pop .5s cubic-bezier(.34,1.56,.64,1) both}
      #boot b{font:800 26px/1 "Schibsted Grotesk",system-ui,sans-serif;letter-spacing:-.02em;color:#14161B;clip-path:inset(0 0 -10% 0)}
      [data-theme="dark"] #boot b{color:#F2F3F6}
      #boot b span{display:inline-block;animation:boot-up .42s cubic-bezier(.2,.8,.2,1) both}
      #boot b span:nth-child(2){color:#E89B00;animation-delay:.06s}
      [data-theme="dark"] #boot b span:nth-child(2){color:#FFBA33}
      #boot i{display:block;width:120px;height:3px;border-radius:3px;background:currentColor;color:#FFB020;transform-origin:left;animation:boot-bar .55s cubic-bezier(.4,0,.2,1) .05s both}
      @keyframes boot-pop{from{opacity:0;transform:scale(.55) rotate(-14deg)}to{opacity:1;transform:none}}
      @keyframes boot-up{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:none}}
      @keyframes boot-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes boot-out{to{opacity:0;transform:scale(1.04);visibility:hidden}}
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><img src="/brand/otter-3d.webp" alt=""><b><span>Snag</span><span>Otter</span></b><i></i></div>
  <div id="root"></div>
  <noscript>SnagOtter needs JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
